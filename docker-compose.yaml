networks:
  elasticsnetwork:
    driver: bridge
    ipam:
      config:
        ## cidr calculator: https://mxtoolbox.com/subnetcalculator.aspx 
        - subnet: 10.62.136.0/25
          gateway: 10.62.136.1
services:
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.17.28
    volumes: 
      - ./data:/usr/share/elasticsearch/data
#      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./certs:/usr/share/elasticsearch/config/certs
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - discovery.type=single-node
#      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - node.name=elastics01
      - cluster.name=${CLUSTER_NAME}
## setting [cluster.initial_master_nodes] is not allowed
## when [discovery.type] is set to [single-node]
#      - cluster.initial_master_nodes=elastics01
#      - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elastics01/elastics01.key
      - xpack.security.http.ssl.certificate=certs/elastics01/elastics01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elastics01/elastics01.key
      - xpack.security.transport.ssl.certificate=certs/elastics01/elastics01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} https://localhost:9200",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    labels:
      ELK_STACK: "true"
    networks:
      elasticsnetwork:
        ipv4_address: 10.62.136.47
        aliases:
          - elasticsearch01
          - elastics
          - elastics-dev
  kibana:
    container_name: kibana
    image: kibana:7.17.28
    ports: 
      - 5601:5601
    environment:
#      - ELASTICSEARCH_HOSTS='["https://elasticsearch01:9200"]'
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
      - ./kibana-data:/usr/share/kibana/data
      - ./kibana-certs:/usr/share/kibana/config/certs
#      - ./kibana.keystore:/usr/share/kibana/config/kibana.keystore
    labels:
      ELK_STACK: "true"
    depends_on: 
      - elasticsearch
    networks:
      elasticsnetwork:
        ipv4_address: 10.62.136.11
        aliases:
          - kibana
          - kibana-dev